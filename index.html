<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project reward bargaining</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Toggle Chat Controls
    <div class="chat-toggle-group">
        <label class="chat-toggle">
            <input type="checkbox" id="toggleChatP1">
            <span class="toggle-label">AI Assistant Player 1</span>
        </label>
        <label class="chat-toggle"> 
            <input type="checkbox" id="toggleChatP2">
            <span class="toggle-label">AI Assistant Player 2</span>
        </label>
    </div> -->

    <div class="container">
        <!-- QR Code Section -->
        <div class="qr-code-container">
            <div>
                <h3>Scan to Fill Survey - player 1</h3>
                <img src="images/Control-group-player1.png" alt="Survey QR Code" style="width: 150px; height: 150px; margin-top: 10px;">
            </div>
            <div>
                <h3>Scan to Fill Survey - player 2</h3>
                <img src="images/Control-group-player2.png" alt="Survey QR Code" style="width: 150px; height: 150px; margin-top: 10px;">
            </div>
        </div>
        <!-- Game Section -->
        <div class="game-section">
            <h1>project reward bargaining game</h1>

            <!-- Player Labels -->
            <div class="player-labels">
                <div id="player1Label" class="player-label active">Player 1</div>
                <div id="player2Label" class="player-label">Player 2</div>
            </div>

            <div class="vlaai-display">
                <div class="vlaai-value">
                    <h2>Total to Split: <span id="cakeValue">100</span>%</h2>
                </div>
                <div class="vlaai-visualization">
                    <img src="images/Price.png" alt="Project reward" style="width: 100px; height: 100px;">
                </div>
            </div>

            <!-- Offer Controls -->
            <div id="offerControls" class="bargaining-controls">
                <div class="offer-section">
                    <label for="offerAmount">Your Share (%):</label>
                    <input type="number" id="offerAmount" min="0" max="100" value="50">
                    <button id="makeOffer" class="primary-button">Make Offer</button>
                </div>
            </div>

            <!-- Response Controls -->
            <div id="responseControls" class="response-controls">
                <button id="acceptOffer" class="success-button">Accept Offer</button>
                <button id="rejectOffer" class="danger-button">Reject Offer</button>
            </div>

            <div class="game-status">
                <p id="gameStatus">Player 1, make your offer!</p>
            </div>

            <div class="game-history">
                <h3>Game History</h3>
                <ul id="historyList"></ul>
            </div>

            <div class="export-section">
                <button onclick="exportGameLogs()" class="secondary-button">Export Game Logs</button>
                <button id="finishExperiment" class="primary-button">Finish Experiment</button>
            </div>
        </div>

        <!-- Player 1 Chat Section -->
        <div id="chatSectionP1" class="chat-section hidden">
            <div class="chat-header"><h2>AI Assistant - Player 1</h2></div>
            <div class="chat-content hidden">
                <div class="chat-messages" id="chatMessagesP1"></div>
                <div class="chat-input">
                    <input type="text" id="userMessageP1" placeholder="Type your message...">
                    <button id="sendMessageP1" class="primary-button">Send</button>
                </div>
            </div>
        </div>

        <!-- Player 2 Chat Section -->
        <div id="chatSectionP2" class="chat-section hidden">
            <div class="chat-header"><h2>AI Assistant - Player 2</h2></div>
            <div class="chat-content hidden">
                <div class="chat-messages" id="chatMessagesP2"></div>
                <div class="chat-input">
                    <input type="text" id="userMessageP2" placeholder="Type your message...">
                    <button id="sendMessageP2" class="primary-button">Send</button>
                </div>
            </div>
        </div>

    <script src="game.js"></script>
    <script src="chat.js"></script>
</body>
</html>
